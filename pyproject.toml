[project]
name = "gitplex"
version = "0.2.0"
description = "Multi-repo git TUI on steroids"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.47.0",
    "gitpython>=3.1.40",
]

[project.scripts]
gitplex = "gitplex.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitplex"]

[tool.hatch.build.targets.wheel.force-include]
"src/gitplex/app.tcss" = "gitplex/app.tcss"
